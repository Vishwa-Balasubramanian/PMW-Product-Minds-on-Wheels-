[project]
name = "pmw-pipeline"
version = "0.1.0"
description = "Product Minds on Wheels: data pipeline from BMW customer evidence to scored requirements"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "python-dotenv>=1.0", "pypdf[crypto]>=6.0", "fonttools>=4.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.84"]

[project.scripts]
pmw = "pmw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pmw"]
